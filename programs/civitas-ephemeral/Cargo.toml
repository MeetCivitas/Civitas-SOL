[workspace]

[profile.release]
overflow-checks = true

[package]
name = "civitas-ephemeral"
version = "0.1.0"
edition = "2021"
rust-version = "1.79.0"
description = "Civitas private payroll — compliance-gated treasury + MagicBlock encrypted-queue settlement"

[lib]
crate-type = ["cdylib", "lib"]
name = "civitas_ephemeral"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["associated_token"] }
